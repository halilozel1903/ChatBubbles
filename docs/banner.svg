<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="ChatBubbles: chat UI building blocks for SwiftUI on iPhone and Mac" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1022"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f80ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2f80ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outgoing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b93ff"/>
      <stop offset="1" stop-color="#0a6cff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="chip" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="940" cy="280" r="300" fill="url(#glow)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="235" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-1.5">ChatBubbles</text>
    <text x="82" y="290" fill="#cbd5e1" font-size="28" font-weight="500">Chat UI building blocks for SwiftUI</text>
    <g font-size="20" font-weight="600">
      <rect x="82" y="330" width="124" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="144" y="357" fill="#e2e8f0" text-anchor="middle">SwiftUI</text>
      <rect x="218" y="330" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="278" y="357" fill="#e2e8f0" text-anchor="middle">iOS 17+</text>
      <rect x="350" y="330" width="148" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="424" y="357" fill="#e2e8f0" text-anchor="middle">macOS 14+</text>
      <rect x="510" y="330" width="118" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="569" y="357" fill="#e2e8f0" text-anchor="middle">Swift 6</text>
    </g>
  </g>

  <!-- Chat window -->
  <g filter="url(#shadow)">
    <rect x="700" y="50" width="500" height="460" rx="26" fill="#ffffff"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif">
    <!-- Header -->
    <circle cx="738" cy="88" r="15" fill="#e2468a"/>
    <circle cx="756" cy="88" r="15" fill="#f2801f" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="774" cy="88" r="15" fill="#1a9e9e" stroke="#ffffff" stroke-width="2.5"/>
    <text x="800" y="86" fill="#0f172a" font-size="16" font-weight="700">Launch Crew</text>
    <text x="800" y="104" fill="#64748b" font-size="12">4 members</text>
    <rect x="700" y="122" width="500" height="1" fill="#0f172a" fill-opacity="0.08"/>

    <text x="950" y="148" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">Today</text>

    <!-- Maya, two grouped bubbles -->
    <text x="770" y="170" fill="#e2468a" font-size="11" font-weight="600">Maya Chen</text>
    <path d="M758 176 h176 a16 16 0 0 1 16 16 v4 a16 16 0 0 1 -16 16 h-176 a4 4 0 0 1 -4 -4 v-28 a4 4 0 0 1 4 -4 Z" fill="#e8e8ed"/>
    <text x="770" y="199" fill="#0f172a" font-size="14">Build 2.0 is on TestFlight.</text>
    <path d="M758 216 h216 a16 16 0 0 1 16 16 v4 a16 16 0 0 1 -16 16 h-200 a16 16 0 0 1 -16 -14 c0 6 -4 12 -10 14 c6 -4 6 -10 6 -14 v-18 a4 4 0 0 1 4 -4 Z" fill="#e8e8ed"/>
    <text x="770" y="239" fill="#0f172a" font-size="14">Notes: <tspan font-weight="700">dark mode</tspan>, faster search</text>
    <circle cx="734" cy="238" r="12" fill="#e2468a"/>
    <text x="734" y="242" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">MC</text>

    <!-- Me, two grouped bubbles with a tail and reactions -->
    <path d="M944 270 h214 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-214 a18 18 0 0 1 -18 -18 a18 18 0 0 1 18 -18 Z" fill="url(#outgoing)"/>
    <text x="944" y="293" fill="#ffffff" font-size="14">That's our best beta yet.</text>
    <path d="M980 310 h178 a4 4 0 0 1 4 4 v16 c0 8 4 14 10 18 c-8 0 -14 -2 -18 -6 c-4 2 -8 2 -12 2 h-162 a18 18 0 0 1 -18 -18 v0 a18 18 0 0 1 18 -18 Z" fill="url(#outgoing)"/>
    <text x="980" y="333" fill="#ffffff" font-size="14">Ship it on Thursday!</text>
    <g filter="url(#chip)">
      <rect x="1086" y="340" width="46" height="22" rx="11" fill="#f7f7fa"/>
      <rect x="1036" y="340" width="44" height="22" rx="11" fill="#f7f7fa"/>
    </g>
    <text x="1046" y="356" font-size="12">👍</text>
    <text x="1064" y="356" fill="#64748b" font-size="11" font-weight="700">3</text>
    <text x="1096" y="356" font-size="12">❤️</text>
    <text x="1114" y="356" fill="#64748b" font-size="11" font-weight="700">2</text>
    <text x="1160" y="378" fill="#64748b" font-size="11" text-anchor="end">Read 9:40 AM</text>

    <!-- Leo typing -->
    <circle cx="734" cy="420" r="12" fill="#f2801f"/>
    <text x="734" y="424" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">LP</text>
    <path d="M766 398 h46 a18 18 0 0 1 18 18 v0 a18 18 0 0 1 -18 18 h-46 a18 18 0 0 1 -14 -6 c-2 3 -6 6 -10 6 c4 -4 6 -8 6 -12 a18 18 0 0 1 18 -24 Z" fill="#e8e8ed" transform="translate(-2 0)"/>
    <circle cx="780" cy="413" r="4.5" fill="#0f172a" fill-opacity="0.85"/>
    <circle cx="795" cy="417" r="4.5" fill="#0f172a" fill-opacity="0.6"/>
    <circle cx="810" cy="419" r="4.5" fill="#0f172a" fill-opacity="0.35"/>

    <!-- Input bar -->
    <rect x="700" y="452" width="500" height="1" fill="#0f172a" fill-opacity="0.08"/>
    <circle cx="738" cy="482" r="16" fill="#0f172a" fill-opacity="0.07"/>
    <path d="M738 474 v16 M730 482 h16" stroke="#64748b" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="764" y="464" width="414" height="36" rx="18" fill="#ffffff" stroke="#0f172a" stroke-opacity="0.15"/>
    <text x="782" y="487" fill="#94a3b8" font-size="14">Message Launch Crew</text>
    <circle cx="1160" cy="482" r="13" fill="#0a6cff"/>
    <path d="M1160 489 v-13 M1154 481 l6 -6 l6 6" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
